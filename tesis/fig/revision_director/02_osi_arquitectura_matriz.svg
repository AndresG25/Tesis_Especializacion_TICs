<text x="181" y="239.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">en este tramo</text>
<rect x="310" y="175" width="128" height="35" rx="3" fill="#F6F7F8" stroke="#52616A" stroke-width="0.7"/>
<text x="314" y="188.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#52616A">Sin TCP ni UDP</text>
<text x="314" y="200.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">en este tramo</text>
<rect x="310" y="214" width="128" height="35" rx="3" fill="#F6F7F8" stroke="#52616A" stroke-width="0.7"/>
<text x="314" y="227.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#52616A">Sin IP</text>
<text x="314" y="239.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">en este tramo</text>
<rect x="443" y="175" width="139" height="35" rx="3" fill="#F3F6FB" stroke="#3565A0" stroke-width="0.7"/>
<text x="447" y="188.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#3565A0">TCP</text>
<text x="447" y="200.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Transporte fiable y ordenado</text>
<rect x="443" y="214" width="139" height="35" rx="3" fill="#F3F6FB" stroke="#3565A0" stroke-width="0.7"/>
<text x="447" y="227.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#3565A0">IP</text>
<text x="447" y="239.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Encaminamiento hacia AWS</text>
<rect x="177" y="253" width="128" height="33" rx="3" fill="#F2F8F8" stroke="#187D86" stroke-width="0.7"/>
<text x="181" y="266.00" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#187D86">ESP-NOW</text>
<text x="181" y="278.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Tramas 802.11 y dir. MAC</text>
<rect x="177" y="290" width="128" height="33" rx="3" fill="#F2F8F8" stroke="#187D86" stroke-width="0.7"/>
<text x="181" y="303.00" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#187D86">Radio de 2,4 GHz</text>
<text x="181" y="315.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Medio inalámbrico</text>
<rect x="310" y="253" width="128" height="70" rx="3" fill="#F2F8F8" stroke="#187D86" stroke-width="0.7"/>
<text x="314" y="266.00" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#187D86">Comunicación serie¹</text>
<text x="314" y="278.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">UART: bytes con bits de</text>
<text x="314" y="289.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">inicio y parada. TX/RX:</text>
<text x="314" y="300.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">señales eléctricas entre</text>
<text x="314" y="311.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">ESP2 y ESP3.</text>
<rect x="443" y="253" width="139" height="33" rx="3" fill="#F3F6FB" stroke="#3565A0" stroke-width="0.7"/>
<text x="447" y="266.00" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#3565A0">Wi-Fi / IEEE 802.11</text>
<text x="447" y="278.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Enlace ESP3 ↔ router²</text>
<rect x="443" y="290" width="139" height="33" rx="3" fill="#F3F6FB" stroke="#3565A0" stroke-width="0.7"/>
<text x="447" y="303.00" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#3565A0">Radio de 2,4 GHz</text>
<text x="447" y="315.52" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Acceso Wi-Fi desde ESP3²</text>
<text x="8" y="338.00" font-family="DejaVu Sans, sans-serif" font-size="9.2" font-weight="700" fill="#173747">Las tarjetas ejecutan varias funciones; cada columna representa un enlace, no una capa.</text>
<text x="8" y="351.00" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="400" fill="#173747">Las tres capas OSI superiores se agrupan de forma conceptual: no son módulos separados del firmware.</text>
<text x="8" y="363.00" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="400" fill="#173747">¹ UART se muestra como interfaz serie; no equivale por sí sola a una pila OSI de dos capas.</text>
<text x="8" y="375.00" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="400" fill="#173747">² Wi-Fi corresponde al primer salto. Desde el router hasta AWS intervienen otros enlaces y medios.</text>
<text x="8" y="387.00" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#173747">Base: ITU-T X.200, documentación ESP-IDF y especificación MQTT. Elaboración propia.</text>
