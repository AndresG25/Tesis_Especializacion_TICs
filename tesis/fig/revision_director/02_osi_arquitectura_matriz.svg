<text x="8" y="43.20" font-family="DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" fill="#173747">Lectura por tramo: ESP-NOW, UART y publicación MQTT segura hacia AWS</text>
<path d="M8 58.36 H582" fill="none" stroke="#52616A" stroke-width="1"/>
<text x="12" y="70.00" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#187D86">MODELO OSI</text>
<text x="103" y="70.00" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#187D86">TCP/IP</text>
<text x="181" y="70.00" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#187D86">ESP1 → ESP2</text>
<text x="314" y="70.00" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#187D86">ESP2 → ESP3</text>
<text x="447" y="70.00" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#187D86">ESP3 → AWS</text>
