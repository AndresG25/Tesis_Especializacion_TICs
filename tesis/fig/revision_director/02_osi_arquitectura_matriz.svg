<text x="103" y="277.65" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#44734C">red</text>
<text x="103" y="290.30" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Enlace y</text>
<text x="103" y="301.30" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">medio físico</text>
<rect x="177" y="94" width="128" height="75" rx="3" fill="#F2F8F8" stroke="#187D86" stroke-width="0.7"/>
<text x="181" y="107.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#187D86">Datos del generador</text>
<text x="181" y="119.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Voltaje, RPM y GPS en una</text>
<text x="181" y="130.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">estructura binaria.</text>
<text x="181" y="141.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Firmware: organiza e</text>
<text x="181" y="152.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">interpreta el mensaje.</text>
<rect x="310" y="94" width="128" height="75" rx="3" fill="#F2F8F8" stroke="#187D86" stroke-width="0.7"/>
<text x="314" y="107.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#187D86">JSON consolidado</text>
<text x="314" y="119.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Medidas del generador +</text>
<text x="314" y="130.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">variables ambientales +</text>
<text x="314" y="141.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">marca temporal.</text>
<text x="314" y="152.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">Firmware: serializa y</text>
<text x="314" y="163.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">reconstruye el mensaje.</text>
<rect x="443" y="94" width="139" height="75" rx="3" fill="#F3F6FB" stroke="#3565A0" stroke-width="0.7"/>
<text x="447" y="107.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#3565A0">MQTT: aplicación</text>
<text x="447" y="119.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">JSON como carga útil. TLS</text>
<text x="447" y="130.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">protege el canal entre ESP3</text>
<text x="447" y="141.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">y AWS y opera sobre TCP.</text>
<rect x="177" y="175" width="128" height="35" rx="3" fill="#F6F7F8" stroke="#52616A" stroke-width="0.7"/>
<text x="181" y="188.00" font-family="DejaVu Sans, sans-serif" font-size="9.1" font-weight="700" fill="#52616A">Sin TCP ni UDP</text>
<text x="181" y="200.65" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="400" fill="#173747">en este tramo</text>
<rect x="177" y="214" width="128" height="35" rx="3" fill="#F6F7F8" stroke="#52616A" stroke-width="0.7"/>
