<text x="59" y="177.00" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#187D86">PROCESAMIENTO Y COMUNICACIÓN LOCAL</text>
<text x="59" y="194.08" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Tres ESP32-C6 con funciones distribuidas</text>
<text x="59" y="209.88" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">ESP1: adquisición → ESP-NOW → ESP2: integración</text>
<text x="59" y="225.68" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">ESP2: JSON → UART → ESP3: conexión segura con AWS</text>
