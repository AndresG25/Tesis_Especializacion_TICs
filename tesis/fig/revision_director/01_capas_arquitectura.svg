<text x="59" y="267.00" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#187D86">RECEPCIÓN, ALMACENAMIENTO Y CONSULTA</text>
<text x="59" y="284.08" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Servicios administrados en AWS</text>
<text x="59" y="299.88" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">AWS IoT Core · DynamoDB: último dato · S3: histórico</text>
<text x="59" y="315.68" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Glue: catálogo · Athena: consultas · Lambda: acceso a datos</text>
<path d="M247 327 V336" fill="none" stroke="#52616A" stroke-width="1" marker-end="url(#a)"/>
