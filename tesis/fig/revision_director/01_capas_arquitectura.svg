<text x="59" y="87.00" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#187D86">FÍSICA Y SENSÓRICA</text>
<text x="59" y="104.08" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Variables del generador y del entorno</text>
<text x="59" y="119.88" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Voltaje · RPM · posición GPS</text>
<text x="59" y="135.68" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#173747">Temperatura · humedad · presión · velocidad del viento</text>
